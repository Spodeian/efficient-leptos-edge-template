[package]
name = "app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure Serverless Edge Leptos UI application, static SSR shell, components, and browser persistence"
publish = false

[dependencies]
leptos = { workspace = true }
leptos_router = { workspace = true }
leptos_meta = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shared = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
web-sys = { workspace = true }
spodeian-cache = { workspace = true }
spodeian-tokens = { workspace = true }
spodeian-web-utils = { workspace = true }
spodeian-telemetry = { workspace = true }
spodeian-persist = { workspace = true }
spodeian-leptos-ui = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }

# Pure serverless edge modes: pre-rendered SSR (`ssg`) paired with browser WASM hydration (`web`).
# No desktop CSR or native shell feature is included.
[features]
ssr = ["leptos/ssr", "leptos_router/ssr", "leptos_meta/ssr"]
hydrate = ["leptos/hydrate"]

[dev-dependencies]
pollster = { workspace = true }

[lints]
workspace = true
